<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173a5e" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Invox" />
  <meta name="format-detection" content="telephone=no" />
  <title>Invox</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">INVOX</div>
        <h1 id="screenTitle">Time</h1>
      </div>
      <button class="icon-button" id="headerAction" type="button" aria-label="Add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="time" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg></span><span>Time</span>
      </button>
      <button class="nav-item" data-view="clients" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.8 18.5c.5-3 2.4-4.7 5.2-4.7s4.7 1.7 5.2 4.7"/><circle cx="16.5" cy="9.5" r="2.2"/><path d="M15.1 14.2c2.9-.5 4.7 1 5.1 3.5"/></svg></span><span>Clients</span>
      </button>
      <button class="nav-item" data-view="rates" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 8.5c-.6-.7-1.5-1-2.5-1-1.5 0-2.6.8-2.6 2 0 3 5.2 1.4 5.2 4.5 0 1.3-1 2.3-2.8 2.3-1.1 0-2.1-.4-2.8-1.1M12 5.8v2M12 16.3v2"/></svg></span><span>Rates</span>
      </button>
      <button class="nav-item" data-view="export" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.8h8l3 3v13.4H7z"/><path d="M15 3.8v3h3M9.5 11.2h6M9.5 14.2h6M9.5 17.2h3.5"/></svg></span><span>Billing</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
